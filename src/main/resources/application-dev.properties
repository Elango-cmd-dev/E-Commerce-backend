spring.datasource.url=jdbc:mysql://localhost:3306/evilan

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.poolName=E-COMMERCE
spring.jmx.enabled=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming_strategy=org.hibernate.cfg.EJB3NamingStrategy
hibernate.schema_update.unique_constraint_strategy=org.hibernate.tool.hbm2ddl.UniqueConstraint

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.generate-ddl=false

evilan.config.baseurl=${CONFIG_URL}
evilan.config.version=${APP_VERSION}

logging.level.root=INFO
logging.file=${LOG_URL}
logging.file.max-size=5MB

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true